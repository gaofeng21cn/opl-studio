name: OPL Studio Additional Carrier Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-studio-additional-carriers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-distribution:
    name: ${{ matrix.label }} package and installer lifecycle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            distribution: windows
            builder_target: win
          - label: Linux x64
            os: ubuntu-latest
            distribution: linux
            builder_target: linux
    env:
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product
      OPL_DESKTOP_WINDOWS_INSTALL_ID: a1f6388a-3f9a-5543-b06c-e3debfa55a91

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the admitted App product-profile cohort
        id: app-cohort
        shell: bash
        run: |
          node -e 'const fs=require("fs");const evidence=JSON.parse(fs.readFileSync("src/candidateContractEvidence.json","utf8"));const sha=evidence.candidate_runtime_qualification?.external_cohort?.app_commit;if(!/^[0-9a-f]{40}$/.test(sha??""))throw new Error("missing exact App cohort commit");process.stdout.write("sha="+sha+"\n")' >> "$GITHUB_OUTPUT"

      - name: Checkout App product authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ steps.app-cohort.outputs.sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native accessibility runtime
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes at-spi2-core dbus-x11 python3-pyatspi

      - name: Run desktop source gates
        run: npm run typecheck && npm run test:desktop

      - name: Prepare lifecycle versions and persistent smoke state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);
          if (!match) throw new Error(`desktop lifecycle requires numeric semver, observed ${pkg.version}`);
          const targetVersion = `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
          const stateRoot = fs.mkdtempSync(path.join(os.tmpdir(), "opl-desktop-package-lifecycle-"));
          const marker = path.join(stateRoot, "existing-user-state.txt");
          fs.writeFileSync(marker, `preserve-${process.env.GITHUB_SHA}\n`, "utf8");
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `OPL_DESKTOP_BASE_VERSION=${pkg.version}`,
            `OPL_DESKTOP_TARGET_VERSION=${targetVersion}`,
            `OPL_DESKTOP_SMOKE_STATE_ROOT=${stateRoot}`,
            `OPL_DESKTOP_STATE_MARKER=${marker}`,
            ""
          ].join("\n"));
          NODE

      - name: Build unsigned base ${{ matrix.label }} distribution
        run: npm run dist:${{ matrix.distribution }}

      - name: Build unsigned target ${{ matrix.label }} distribution
        shell: bash
        run: |
          npx electron-builder \
            --${{ matrix.builder_target }} \
            --config electron-builder.yml \
            --publish never \
            --config.directories.output=out-target \
            --config.extraMetadata.version="$OPL_DESKTOP_TARGET_VERSION"

      - name: Validate base and target native package sets
        shell: bash
        run: |
          npm run qualify:desktop:distribution
          node scripts/validate-desktop-package.mjs \
            --distribution \
            --out-root out-target \
            --version "$OPL_DESKTOP_TARGET_VERSION"

      - name: Prepare Chromium sandbox for unpacked Linux runtime
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          sudo chown root:root out/linux-unpacked/chrome-sandbox
          sudo chmod 4755 out/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' out/linux-unpacked/chrome-sandbox)" = "root:root 4755"

      - name: Start unpacked app and read Chromium AX tree
        shell: bash
        run: |
          if test "${{ matrix.distribution }}" = linux; then
            OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_BASE_VERSION" \
              xvfb-run --auto-servernum npm run smoke:desktop-live
          else
            OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_BASE_VERSION" \
              npm run smoke:desktop-live
          fi

      - name: Install base Windows NSIS package
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path out -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }

          $installRegistryPath = "HKCU:\Software\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $uninstallRegistryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $programsRoot = Join-Path $env:LOCALAPPDATA 'Programs'
          $fallbackInstallRoot = Join-Path $programsRoot 'opl-studio'
          if ((Test-Path -LiteralPath $installRegistryPath) -or
              (Test-Path -LiteralPath $uninstallRegistryPath) -or
              (Test-Path -LiteralPath $fallbackInstallRoot)) {
            throw "clean runner already contains the exact One Person Lab Preview install identity"
          }

          "OPL_DESKTOP_WINDOWS_INSTALL_ATTEMPTED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $installerProcess = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($installerProcess.ExitCode)"
          }

          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path -LiteralPath $installRegistryPath) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path -LiteralPath $installRegistryPath)) {
            throw "NSIS install did not create its exact HKCU install identity"
          }

          $installRoot = [IO.Path]::GetFullPath((Get-ItemProperty -LiteralPath $installRegistryPath).InstallLocation)
          $programsPrefix = [IO.Path]::GetFullPath($programsRoot).TrimEnd('\') + '\'
          if (-not $installRoot.StartsWith($programsPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "NSIS InstallLocation escaped the current-user Programs root: $installRoot"
          }
          $installedExecutable = Join-Path $installRoot 'One Person Lab Preview.exe'
          $uninstaller = Join-Path $installRoot 'Uninstall One Person Lab Preview.exe'
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "NSIS InstallLocation is missing the application executable: $installedExecutable"
          }
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "NSIS InstallLocation is missing the uninstaller: $uninstaller"
          }
          if (-not (Test-Path -LiteralPath $uninstallRegistryPath)) {
            throw "NSIS install did not register its exact uninstall identity"
          }
          $installedVersion = [string](Get-ItemProperty -LiteralPath $uninstallRegistryPath).DisplayVersion
          if ($installedVersion -ne $env:OPL_DESKTOP_BASE_VERSION) {
            throw "NSIS base install reported version $installedVersion instead of $env:OPL_DESKTOP_BASE_VERSION"
          }

          "OPL_DESKTOP_EXECUTABLE=$installedExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPL_DESKTOP_APP_PATH=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start base Windows app and read exact version
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $env:OPL_DESKTOP_EXPECTED_VERSION = $env:OPL_DESKTOP_BASE_VERSION
          $env:OPL_DESKTOP_NATIVE_ACCESSIBILITY_QUALIFICATION = '1'
          npm run smoke:desktop-live

      - name: Update Windows NSIS package
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path out-target -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one target NSIS installer, found $($installers.Count)"
          }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS update exited with code $($process.ExitCode)"
          }
          $uninstallRegistryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $installedVersion = [string](Get-ItemProperty -LiteralPath $uninstallRegistryPath).DisplayVersion
          if ($installedVersion -ne $env:OPL_DESKTOP_TARGET_VERSION) {
            throw "NSIS update reported version $installedVersion instead of $env:OPL_DESKTOP_TARGET_VERSION"
          }
          if ((Get-Content -LiteralPath $env:OPL_DESKTOP_STATE_MARKER -Raw).Trim() -ne "preserve-$env:GITHUB_SHA") {
            throw "NSIS update did not preserve the existing user-state marker"
          }

      - name: Start updated Windows app and read exact version
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $env:OPL_DESKTOP_EXPECTED_VERSION = $env:OPL_DESKTOP_TARGET_VERSION
          $env:OPL_DESKTOP_NATIVE_ACCESSIBILITY_QUALIFICATION = '1'
          npm run smoke:desktop-live

      - name: Roll back Windows NSIS package
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path out -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one base NSIS installer, found $($installers.Count)"
          }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS rollback exited with code $($process.ExitCode)"
          }
          $uninstallRegistryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $installedVersion = [string](Get-ItemProperty -LiteralPath $uninstallRegistryPath).DisplayVersion
          if ($installedVersion -ne $env:OPL_DESKTOP_BASE_VERSION) {
            throw "NSIS rollback reported version $installedVersion instead of $env:OPL_DESKTOP_BASE_VERSION"
          }
          if ((Get-Content -LiteralPath $env:OPL_DESKTOP_STATE_MARKER -Raw).Trim() -ne "preserve-$env:GITHUB_SHA") {
            throw "NSIS rollback did not preserve the existing user-state marker"
          }

      - name: Start rolled-back Windows app and read exact version
        if: matrix.distribution == 'windows'
        shell: pwsh
        run: |
          $env:OPL_DESKTOP_EXPECTED_VERSION = $env:OPL_DESKTOP_BASE_VERSION
          $env:OPL_DESKTOP_NATIVE_ACCESSIBILITY_QUALIFICATION = '1'
          npm run smoke:desktop-live

      - name: Uninstall Windows NSIS package and verify cleanup
        if: ${{ always() && matrix.distribution == 'windows' }}
        shell: pwsh
        run: |
          if ($env:OPL_DESKTOP_WINDOWS_INSTALL_ATTEMPTED -ne '1') {
            Write-Host 'No NSIS install was attempted by this job; leaving pre-existing state untouched.'
            exit 0
          }

          $installRegistryPath = "HKCU:\Software\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $uninstallRegistryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:OPL_DESKTOP_WINDOWS_INSTALL_ID"
          $fallbackInstallRoot = Join-Path (Join-Path $env:LOCALAPPDATA 'Programs') 'opl-studio'
          $installRoot = if (Test-Path -LiteralPath $installRegistryPath) {
            [string](Get-ItemProperty -LiteralPath $installRegistryPath).InstallLocation
          } elseif ($env:OPL_DESKTOP_APP_PATH) {
            $env:OPL_DESKTOP_APP_PATH
          } else {
            $fallbackInstallRoot
          }

          $uninstaller = Join-Path $installRoot 'Uninstall One Person Lab Preview.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($uninstallProcess.ExitCode -ne 0) {
              throw "NSIS uninstaller exited with code $($uninstallProcess.ExitCode)"
            }
          } elseif ((Test-Path -LiteralPath $installRoot) -or (Test-Path -LiteralPath $installRegistryPath)) {
            throw "NSIS install attempt left product state without its exact uninstaller"
          }

          $deadline = (Get-Date).AddSeconds(30)
          while (((Test-Path -LiteralPath $installRoot) -or
                  (Test-Path -LiteralPath $installRegistryPath) -or
                  (Test-Path -LiteralPath $uninstallRegistryPath)) -and
                 (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if ((Test-Path -LiteralPath $installRoot) -or
              (Test-Path -LiteralPath $installRegistryPath) -or
              (Test-Path -LiteralPath $uninstallRegistryPath)) {
            throw "NSIS uninstall left exact product files or registry identity behind"
          }

      - name: Install base Linux DEB package
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(out/*.deb)
          test "${#debs[@]}" -eq 1
          package_name="$(dpkg-deb -f "${debs[0]}" Package)"
          test -n "$package_name"
          echo "OPL_DESKTOP_DEB_PACKAGE=$package_name" >> "$GITHUB_ENV"

          deb_path="$(realpath "${debs[0]}")"
          sudo apt-get install --no-install-recommends --yes "$deb_path"
          test "$(dpkg-query -W -f='${Version}' "$package_name")" = "$OPL_DESKTOP_BASE_VERSION"
          executable="$(command -v one-person-lab-preview)"
          test -n "$executable"
          real_executable="$(readlink -f "$executable")"
          app_path="$(dirname "$real_executable")"
          test -x "$real_executable"
          if sudo bash -c '[[ -L /proc/self/ns/user ]] && unshare --user true'; then
            expected_sandbox_state='root:root 755'
          else
            expected_sandbox_state='root:root 4755'
          fi
          test "$(stat -c '%U:%G %a' "$app_path/chrome-sandbox")" = "$expected_sandbox_state"

          echo "OPL_DESKTOP_EXECUTABLE=$executable" >> "$GITHUB_ENV"
          echo "OPL_DESKTOP_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Start base Linux app and read exact version
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          dbus-run-session -- env \
            NO_AT_BRIDGE=0 \
            OPL_DESKTOP_NATIVE_ACCESSIBILITY_QUALIFICATION=1 \
            OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_BASE_VERSION" \
            xvfb-run --auto-servernum npm run smoke:desktop-live

      - name: Update Linux DEB package
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(out-target/*.deb)
          test "${#debs[@]}" -eq 1
          sudo apt-get install --no-install-recommends --yes "$(realpath "${debs[0]}")"
          test "$(dpkg-query -W -f='${Version}' "$OPL_DESKTOP_DEB_PACKAGE")" = "$OPL_DESKTOP_TARGET_VERSION"
          test "$(tr -d '\r\n' < "$OPL_DESKTOP_STATE_MARKER")" = "preserve-$GITHUB_SHA"

      - name: Start updated Linux app and read exact version
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          dbus-run-session -- env \
            NO_AT_BRIDGE=0 \
            OPL_DESKTOP_NATIVE_ACCESSIBILITY_QUALIFICATION=1 \
            OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_TARGET_VERSION" \
            xvfb-run --auto-servernum npm run smoke:desktop-live

      - name: Roll back Linux DEB package
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(out/*.deb)
          test "${#debs[@]}" -eq 1
          sudo apt-get install --no-install-recommends --yes --allow-downgrades "$(realpath "${debs[0]}")"
          test "$(dpkg-query -W -f='${Version}' "$OPL_DESKTOP_DEB_PACKAGE")" = "$OPL_DESKTOP_BASE_VERSION"
          test "$(tr -d '\r\n' < "$OPL_DESKTOP_STATE_MARKER")" = "preserve-$GITHUB_SHA"

      - name: Start rolled-back Linux app and read exact version
        if: matrix.distribution == 'linux'
        shell: bash
        run: |
          dbus-run-session -- env \
            NO_AT_BRIDGE=0 \
            OPL_DESKTOP_NATIVE_ACCESSIBILITY_QUALIFICATION=1 \
            OPL_DESKTOP_EXPECTED_VERSION="$OPL_DESKTOP_BASE_VERSION" \
            xvfb-run --auto-servernum npm run smoke:desktop-live

      - name: Purge Linux DEB package and verify cleanup
        if: ${{ always() && matrix.distribution == 'linux' }}
        shell: bash
        run: |
          package_name="${OPL_DESKTOP_DEB_PACKAGE:-}"
          if test -z "$package_name"; then
            shopt -s nullglob
            debs=(out/*.deb)
            if test "${#debs[@]}" -eq 1; then
              package_name="$(dpkg-deb -f "${debs[0]}" Package)"
            fi
          fi

          if test -n "$package_name" && dpkg-query -W "$package_name" >/dev/null 2>&1; then
            sudo dpkg --purge "$package_name"
          fi

          if test -n "${OPL_DESKTOP_EXECUTABLE:-}"; then
            test ! -e "$OPL_DESKTOP_EXECUTABLE"
          fi
          if test -n "${OPL_DESKTOP_APP_PATH:-}"; then
            test ! -e "$OPL_DESKTOP_APP_PATH"
          fi
          if command -v one-person-lab-preview >/dev/null 2>&1; then
            echo "Linux purge left one-person-lab-preview on PATH" >&2
            exit 1
          fi
          status="$(dpkg-query -W -f='${Status}' "$package_name" 2>/dev/null || true)"
          test "$status" != "install ok installed"

      - name: Remove lifecycle smoke state
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          const root = process.env.OPL_DESKTOP_SMOKE_STATE_ROOT;
          if (!root) process.exit(0);
          const relative = path.relative(fs.realpathSync.native(os.tmpdir()), fs.realpathSync.native(root));
          if (!relative || relative === ".." || relative.startsWith(`..${path.sep}`) || path.isAbsolute(relative)) {
            throw new Error(`refusing to remove lifecycle state outside the system temp directory: ${root}`);
          }
          fs.rmSync(root, { recursive: true, force: true });
          NODE

  headless-installed-macos:
    name: macOS headless installed lifecycle
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      OPL_APP_OPL_BIN: ${{ github.workspace }}/framework/bin/opl
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Framework/App cohort
        id: runtime-cohort
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = JSON.parse(fs.readFileSync("src/candidateContractEvidence.json", "utf8"));
          const cohort = evidence.candidate_runtime_qualification?.external_cohort ?? {};
          for (const [name, value] of [["framework_sha", cohort.framework_commit], ["app_sha", cohort.app_commit]]) {
            if (!/^[0-9a-f]{40}$/.test(value ?? "")) throw new Error(`missing exact ${name} cohort commit`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          NODE

      - name: Checkout Framework Host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ steps.runtime-cohort.outputs.framework_sha }}
          path: framework
          persist-credentials: false

      - name: Checkout App product authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ steps.runtime-cohort.outputs.app_sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Studio dependencies
        run: npm ci

      - name: Prepare pinned Framework runtime
        working-directory: framework
        run: npm ci --ignore-scripts && npm run build:packages

      - name: Install pinned Codex CLI
        shell: bash
        run: |
          npm install --global @openai/codex@0.147.0
          codex_path="$(command -v codex)"
          test -x "$codex_path"
          test "$(codex --version)" = "codex-cli 0.147.0"
          codex_home="$RUNNER_TEMP/codex-home"
          install_root="$RUNNER_TEMP/one-person-lab-headless"
          workspace_root="$RUNNER_TEMP/opl-workspace"
          base_source="$RUNNER_TEMP/opl-headless-base-source"
          mkdir -p "$codex_home" "$workspace_root"
          {
            echo "CODEX_HOME=$codex_home"
            echo "OPL_CODEX_BIN=$codex_path"
            echo "OPL_HEADLESS_BASE_SOURCE=$base_source"
            echo "OPL_HEADLESS_BASE_VERSION=0.0.0-headless-base"
            echo "OPL_HEADLESS_INSTALL_ROOT=$install_root"
            echo "OPL_HEADLESS_TARGET_VERSION=$(node -p 'require("./package.json").version')"
            echo "OPL_HEADLESS_WORKSPACE_ROOT=$workspace_root"
          } >> "$GITHUB_ENV"

      - name: Build shared WebUI
        run: npm run build:webui

      - name: Prepare base headless payload
        shell: bash
        run: |
          mkdir -p "$OPL_HEADLESS_BASE_SOURCE/dist" "$OPL_HEADLESS_BASE_SOURCE/scripts"
          cp package.json "$OPL_HEADLESS_BASE_SOURCE/package.json"
          cp -R dist/webui "$OPL_HEADLESS_BASE_SOURCE/dist/webui"
          cp -R scripts/headless "$OPL_HEADLESS_BASE_SOURCE/scripts/headless"
          cp -R src/host "$OPL_HEADLESS_BASE_SOURCE/src/host"
          cp scripts/install-headless.mjs "$OPL_HEADLESS_BASE_SOURCE/scripts/install-headless.mjs"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = `${process.env.OPL_HEADLESS_BASE_SOURCE}/package.json`;
          const value = JSON.parse(fs.readFileSync(path, "utf8"));
          value.version = process.env.OPL_HEADLESS_BASE_VERSION;
          fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          NODE

      - name: Install headless macOS user service
        shell: bash
        run: |
          npm run --silent headless:install -- \
            --source "$OPL_HEADLESS_BASE_SOURCE" \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            --readback-timeout-ms 120000 \
            | tee "$RUNNER_TEMP/opl-headless-install.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-install.json`, "utf8"));
          if (result.schema !== "opl_headless_installer_result.v1" || result.status !== "installed") throw new Error("headless install receipt is invalid");
          if (result.readback?.ready?.status !== "ready") throw new Error("installed /readyz status is not ready");
          if (result.readback.ready.appServerAvailable !== true) throw new Error("installed Codex App Server is unavailable");
          if (result.readback?.appState?.readback?.exitCode !== 0) throw new Error("installed App state readback failed");
          if (result.readback.appState.surfaceKind !== "opl_app_state.v1") throw new Error("installed App state surface is not opl_app_state.v1");
          if (result.version !== process.env.OPL_HEADLESS_BASE_VERSION) throw new Error("headless base version is not installed");
          NODE

      - name: Update and restart installed headless runtime
        shell: bash
        run: |
          npm run --silent headless:update -- \
            --source "$GITHUB_WORKSPACE" \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            --readback-timeout-ms 120000 \
            | tee "$RUNNER_TEMP/opl-headless-update.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-update.json`, "utf8"));
          if (result.status !== "updated" || result.version !== process.env.OPL_HEADLESS_TARGET_VERSION) throw new Error("installed headless update did not reach target version");
          if (result.update?.state !== "applied" || result.service?.native?.exitCode !== 0) throw new Error("installed headless update did not restart its service");
          if (result.readback?.status !== "ready" || result.readback?.appState?.readback?.exitCode !== 0) throw new Error("updated headless runtime readback failed");
          NODE

      - name: Roll back and restart installed headless runtime
        shell: bash
        run: |
          npm run --silent headless:rollback -- \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            --readback-timeout-ms 120000 \
            | tee "$RUNNER_TEMP/opl-headless-rollback.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-rollback.json`, "utf8"));
          if (result.status !== "rolled_back" || result.version !== process.env.OPL_HEADLESS_BASE_VERSION) throw new Error("installed headless rollback did not restore base version");
          if (result.update?.state !== "rolled_back" || result.service?.native?.exitCode !== 0) throw new Error("installed headless rollback did not restart its service");
          if (result.readback?.status !== "ready" || result.readback?.appState?.readback?.exitCode !== 0) throw new Error("rolled-back headless runtime readback failed");
          NODE

      - name: Inspect installed headless runtime
        shell: bash
        run: |
          npm run --silent headless:status -- \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            | tee "$RUNNER_TEMP/opl-headless-status.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-status.json`, "utf8"));
          if (result.status !== "inspected" || result.service?.native?.exitCode !== 0) throw new Error("installed launchd service is not active");
          if (result.version !== process.env.OPL_HEADLESS_BASE_VERSION) throw new Error("headless status did not retain rolled-back version");
          if (result.readback?.status !== "ready" || result.readback?.appState?.readback?.exitCode !== 0) throw new Error("installed runtime readback failed");
          NODE

      - name: Verify installed LaunchAgent binding
        shell: bash
        run: |
          plist="$HOME/Library/LaunchAgents/com.onepersonlab.headless.plist"
          test -f "$plist"
          test "$(plutil -extract ProgramArguments.1 raw "$plist")" = "$OPL_HEADLESS_INSTALL_ROOT/current/scripts/headless/run.mjs"
          test "$(plutil -extract EnvironmentVariables.OPL_APP_OPL_BIN raw "$plist")" = "$OPL_APP_OPL_BIN"
          test "$(plutil -extract EnvironmentVariables.OPL_APP_REPO_ROOT raw "$plist")" = "$OPL_APP_REPO_ROOT"
          test "$(plutil -extract EnvironmentVariables.OPL_APP_STATE_TIMEOUT_MS raw "$plist")" = "120000"
          test "$(plutil -extract EnvironmentVariables.OPL_CODEX_BIN raw "$plist")" = "$OPL_CODEX_BIN"
          test "$(plutil -extract EnvironmentVariables.CODEX_HOME raw "$plist")" = "$CODEX_HOME"

      - name: Uninstall headless macOS user service and verify cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          if test -f "$OPL_HEADLESS_INSTALL_ROOT/installation.json"; then
            npm run --silent headless:uninstall -- \
              --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
              --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
              | tee "$RUNNER_TEMP/opl-headless-uninstall.json"
          fi
          if launchctl print "gui/$(id -u)/com.onepersonlab.headless" >/dev/null 2>&1; then
            echo "headless launchd service remains loaded" >&2
            exit 1
          fi
          test ! -e "$HOME/Library/LaunchAgents/com.onepersonlab.headless.plist"
          test ! -e "$OPL_HEADLESS_INSTALL_ROOT"

  headless-installed-linux:
    name: Linux headless installed lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPL_APP_OPL_BIN: ${{ github.workspace }}/framework/bin/opl
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Framework/App cohort
        id: runtime-cohort
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = JSON.parse(fs.readFileSync("src/candidateContractEvidence.json", "utf8"));
          const cohort = evidence.candidate_runtime_qualification?.external_cohort ?? {};
          for (const [name, value] of [["framework_sha", cohort.framework_commit], ["app_sha", cohort.app_commit]]) {
            if (!/^[0-9a-f]{40}$/.test(value ?? "")) throw new Error(`missing exact ${name} cohort commit`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          NODE

      - name: Checkout Framework Host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ steps.runtime-cohort.outputs.framework_sha }}
          path: framework
          persist-credentials: false

      - name: Checkout App product authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ steps.runtime-cohort.outputs.app_sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Studio dependencies
        run: npm ci

      - name: Prepare pinned Framework runtime
        working-directory: framework
        run: npm ci --ignore-scripts && npm run build:packages

      - name: Install pinned Codex CLI
        shell: bash
        run: |
          npm install --global @openai/codex@0.147.0
          codex_path="$(command -v codex)"
          test -x "$codex_path"
          test "$(codex --version)" = "codex-cli 0.147.0"
          codex_home="$RUNNER_TEMP/codex-home"
          install_root="$RUNNER_TEMP/one-person-lab-headless"
          workspace_root="$RUNNER_TEMP/opl-workspace"
          base_source="$RUNNER_TEMP/opl-headless-base-source"
          mkdir -p "$codex_home" "$workspace_root"
          {
            echo "CODEX_HOME=$codex_home"
            echo "OPL_CODEX_BIN=$codex_path"
            echo "OPL_HEADLESS_BASE_SOURCE=$base_source"
            echo "OPL_HEADLESS_BASE_VERSION=0.0.0-headless-base"
            echo "OPL_HEADLESS_INSTALL_ROOT=$install_root"
            echo "OPL_HEADLESS_TARGET_VERSION=$(node -p 'require("./package.json").version')"
            echo "OPL_HEADLESS_WORKSPACE_ROOT=$workspace_root"
          } >> "$GITHUB_ENV"

      - name: Prepare Linux user service manager
        shell: bash
        run: |
          user_id="$(id -u)"
          user_name="$(id -un)"
          runtime_dir="/run/user/${user_id}"
          linger="$(loginctl show-user "$user_name" --property=Linger --value)"
          if test "$linger" = yes; then
            echo "OPL_HEADLESS_LINGER_ENABLED_BY_JOB=0" >> "$GITHUB_ENV"
          else
            sudo loginctl enable-linger "$user_name"
            echo "OPL_HEADLESS_LINGER_ENABLED_BY_JOB=1" >> "$GITHUB_ENV"
          fi
          sudo systemctl start "user@${user_id}.service"
          test -d "$runtime_dir"
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "OPL_HEADLESS_USER_ID=$user_id"
            echo "OPL_HEADLESS_USER_NAME=$user_name"
          } >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime_dir" systemctl --user show-environment >/dev/null
          test "$(XDG_RUNTIME_DIR="$runtime_dir" systemctl --user show one-person-lab-headless.service --property=LoadState --value)" = not-found
          test ! -e "$HOME/.config/systemd/user/one-person-lab-headless.service"

      - name: Build shared WebUI
        run: npm run build:webui

      - name: Prepare base headless payload
        shell: bash
        run: |
          mkdir -p "$OPL_HEADLESS_BASE_SOURCE/dist" "$OPL_HEADLESS_BASE_SOURCE/scripts"
          cp package.json "$OPL_HEADLESS_BASE_SOURCE/package.json"
          cp -R dist/webui "$OPL_HEADLESS_BASE_SOURCE/dist/webui"
          cp -R scripts/headless "$OPL_HEADLESS_BASE_SOURCE/scripts/headless"
          cp -R src/host "$OPL_HEADLESS_BASE_SOURCE/src/host"
          cp scripts/install-headless.mjs "$OPL_HEADLESS_BASE_SOURCE/scripts/install-headless.mjs"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = `${process.env.OPL_HEADLESS_BASE_SOURCE}/package.json`;
          const value = JSON.parse(fs.readFileSync(path, "utf8"));
          value.version = process.env.OPL_HEADLESS_BASE_VERSION;
          fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          NODE

      - name: Install headless Linux user service
        shell: bash
        run: |
          npm run --silent headless:install -- \
            --source "$OPL_HEADLESS_BASE_SOURCE" \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            --readback-timeout-ms 120000 \
            | tee "$RUNNER_TEMP/opl-headless-linux-install.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-linux-install.json`, "utf8"));
          if (result.schema !== "opl_headless_installer_result.v1" || result.status !== "installed") throw new Error("headless Linux install receipt is invalid");
          if (result.readback?.ready?.status !== "ready" || result.readback.ready.appServerAvailable !== true) throw new Error("installed Linux Headless runtime is not ready");
          if (result.readback?.appState?.readback?.exitCode !== 0 || result.readback.appState.surfaceKind !== "opl_app_state.v1") throw new Error("installed Linux App-state readback failed");
          if (result.version !== process.env.OPL_HEADLESS_BASE_VERSION) throw new Error("headless Linux base version is not installed");
          NODE

      - name: Stop and inspect headless Linux user service
        shell: bash
        run: |
          npm run --silent headless:stop -- \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            | tee "$RUNNER_TEMP/opl-headless-linux-stop.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-linux-stop.json`, "utf8"));
          if (result.status !== "stopped" || result.service?.native?.exitCode !== 0 || result.readback !== null) throw new Error("headless Linux stop receipt is invalid");
          NODE
          systemctl --user show one-person-lab-headless.service --property=ActiveState,SubState --no-pager | tee "$RUNNER_TEMP/opl-headless-linux-stopped.txt"
          grep -qx 'ActiveState=inactive' "$RUNNER_TEMP/opl-headless-linux-stopped.txt"

      - name: Start headless Linux user service
        shell: bash
        run: |
          npm run --silent headless:start -- \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            --readback-timeout-ms 120000 \
            | tee "$RUNNER_TEMP/opl-headless-linux-start.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-linux-start.json`, "utf8"));
          if (result.status !== "started" || result.service?.native?.exitCode !== 0 || result.readback?.status !== "ready") throw new Error("headless Linux start receipt is invalid");
          NODE

      - name: Restart headless Linux user service
        shell: bash
        run: |
          npm run --silent headless:restart -- \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            --readback-timeout-ms 120000 \
            | tee "$RUNNER_TEMP/opl-headless-linux-restart.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-linux-restart.json`, "utf8"));
          if (result.status !== "restarted" || result.service?.native?.exitCode !== 0 || result.readback?.status !== "ready") throw new Error("headless Linux restart receipt is invalid");
          NODE

      - name: Update and restart installed headless Linux runtime
        shell: bash
        run: |
          npm run --silent headless:update -- \
            --source "$GITHUB_WORKSPACE" \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            --readback-timeout-ms 120000 \
            | tee "$RUNNER_TEMP/opl-headless-linux-update.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-linux-update.json`, "utf8"));
          if (result.status !== "updated" || result.version !== process.env.OPL_HEADLESS_TARGET_VERSION) throw new Error("installed Linux Headless update did not reach target version");
          if (result.update?.state !== "applied" || result.service?.native?.exitCode !== 0 || result.readback?.status !== "ready") throw new Error("installed Linux Headless update did not restart cleanly");
          NODE

      - name: Roll back and restart installed headless Linux runtime
        shell: bash
        run: |
          npm run --silent headless:rollback -- \
            --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
            --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
            --readback-timeout-ms 120000 \
            | tee "$RUNNER_TEMP/opl-headless-linux-rollback.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/opl-headless-linux-rollback.json`, "utf8"));
          if (result.status !== "rolled_back" || result.version !== process.env.OPL_HEADLESS_BASE_VERSION) throw new Error("installed Linux Headless rollback did not restore base version");
          if (result.update?.state !== "rolled_back" || result.service?.native?.exitCode !== 0 || result.readback?.status !== "ready") throw new Error("installed Linux Headless rollback did not restart cleanly");
          NODE

      - name: Verify installed systemd user-service binding
        shell: bash
        run: |
          unit="$HOME/.config/systemd/user/one-person-lab-headless.service"
          test -f "$unit"
          systemd-analyze --user verify "$unit"
          systemctl --user show one-person-lab-headless.service --property=LoadState,ActiveState,SubState --no-pager | tee "$RUNNER_TEMP/opl-headless-linux-active.txt"
          grep -qx 'LoadState=loaded' "$RUNNER_TEMP/opl-headless-linux-active.txt"
          grep -qx 'ActiveState=active' "$RUNNER_TEMP/opl-headless-linux-active.txt"
          grep -qx 'SubState=running' "$RUNNER_TEMP/opl-headless-linux-active.txt"
          systemctl --user show one-person-lab-headless.service --property=ExecStart --value | grep -F "$OPL_HEADLESS_INSTALL_ROOT/current/scripts/headless/run.mjs"
          grep -F "Environment=\"OPL_APP_OPL_BIN=$OPL_APP_OPL_BIN\"" "$unit"
          grep -F "Environment=\"OPL_APP_REPO_ROOT=$OPL_APP_REPO_ROOT\"" "$unit"
          grep -F 'Environment="OPL_APP_STATE_TIMEOUT_MS=120000"' "$unit"
          grep -F "Environment=\"OPL_CODEX_BIN=$OPL_CODEX_BIN\"" "$unit"
          grep -F "Environment=\"CODEX_HOME=$CODEX_HOME\"" "$unit"

      - name: Uninstall headless Linux user service and verify cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          if test -f "$HOME/.config/systemd/user/one-person-lab-headless.service"; then
            systemctl --user status one-person-lab-headless.service --no-pager || true
            journalctl --user-unit=one-person-lab-headless.service --no-pager --lines=200 || true
          fi
          if test -f "$OPL_HEADLESS_INSTALL_ROOT/installation.json"; then
            npm run --silent headless:uninstall -- \
              --install-root "$OPL_HEADLESS_INSTALL_ROOT" \
              --workspace "$OPL_HEADLESS_WORKSPACE_ROOT" \
              | tee "$RUNNER_TEMP/opl-headless-linux-uninstall.json"
          fi
          load_state="$(systemctl --user show one-person-lab-headless.service --property=LoadState --value)"
          test "$load_state" = not-found
          test ! -e "$HOME/.config/systemd/user/one-person-lab-headless.service"
          test ! -e "$OPL_HEADLESS_INSTALL_ROOT"
          if test "${OPL_HEADLESS_LINGER_ENABLED_BY_JOB:-0}" = 1; then
            sudo loginctl disable-linger "$OPL_HEADLESS_USER_NAME"
          fi

  oci-distribution:
    name: OCI native ${{ matrix.architecture }} build and lifecycle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      OPL_OCI_LIFECYCLE_PLATFORM: ${{ matrix.platform }}
      OPL_OCI_REQUIRE_NATIVE_ARCHITECTURE: "true"

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install dependencies
        run: npm ci

      - name: Run OCI source gates
        run: npm run test:oci

      - name: Build non-public native-architecture OCI layout
        shell: bash
        run: |
          cohort_json="$(node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync("src/candidateContractEvidence.json","utf8"));process.stdout.write(JSON.stringify(e.candidate_runtime_qualification?.external_cohort??{}))')"
          framework_ref="$(jq -er '.framework_commit | select(test("^[0-9a-f]{40}$"))' <<<"$cohort_json")"
          app_ref="$(jq -er '.app_commit | select(test("^[0-9a-f]{40}$"))' <<<"$cohort_json")"
          archive="$RUNNER_TEMP/one-person-lab-${GITHUB_SHA}.oci.tar"
          plan="$RUNNER_TEMP/one-person-lab-oci-build-plan.json"

          npm run --silent plan:oci:multiarch -- \
            --image "opl-studio:non-release-${GITHUB_SHA}" \
            --source-revision "$GITHUB_SHA" \
            --framework-ref "$framework_ref" \
            --app-ref "$app_ref" \
            --platform "$OPL_OCI_LIFECYCLE_PLATFORM" \
            --output "$archive" > "$plan"

          test "$(jq -r '.evidenceBoundary.publishesImage' "$plan")" = false
          jq -e '.command | index("--push") == null and all(.[]; contains("type=registry") | not)' "$plan"
          node -e 'const fs=require("fs"),{spawnSync}=require("child_process");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const r=spawnSync(p.command[0],p.command.slice(1),{stdio:"inherit"});process.exit(r.status??1)' "$plan"
          test -s "$archive"
          image_index_digest="$(tar -xOf "$archive" index.json | jq -er '
            [.manifests[] | select(.mediaType == "application/vnd.oci.image.index.v1+json")]
              | if length == 1 then .[0].digest else error("expected exactly one image index") end
          ')"
          image_index_path="blobs/sha256/${image_index_digest#sha256:}"
          tar -xOf "$archive" "$image_index_path" | jq -e --arg architecture "${{ matrix.architecture }}" '
            ([.manifests[] | select(.platform.os == "linux") | .platform.architecture]
              | sort | unique) == [$architecture] and
            ([.manifests[] | select(
                .platform.os == "unknown" and
                .platform.architecture == "unknown" and
                .annotations["vnd.docker.reference.type"] == "attestation-manifest"
              )] | length) == 1
          '

      - name: Prove hosted native OCI lifecycle
        run: npm run smoke:docker:lifecycle
