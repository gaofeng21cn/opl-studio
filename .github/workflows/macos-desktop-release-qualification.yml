name: OPL Studio macOS Desktop Release Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-studio-macos-desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-desktop:
    name: macOS arm64 Desktop baseline
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned App product cohort
        id: app-cohort
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = JSON.parse(fs.readFileSync("src/candidateContractEvidence.json", "utf8"));
          const appCommit = evidence.candidate_runtime_qualification?.external_cohort?.app_commit;
          if (!/^[0-9a-f]{40}$/.test(appCommit ?? "")) throw new Error("missing exact App product cohort commit");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${appCommit}\n`);
          NODE

      - name: Checkout pinned App product contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ steps.app-cohort.outputs.sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify native arm64 runner
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: npm ci

      - name: Run macOS Desktop source gates
        run: npm run typecheck && npm run test:desktop

      - name: Build unsigned macOS arm64 Desktop candidate
        shell: bash
        run: |
          npm run build:desktop
          npx electron-builder --mac --arm64 --config electron-builder.yml --publish never

      - name: Validate macOS arm64 package and update metadata
        shell: bash
        run: |
          npm run qualify:desktop:distribution
          executable="out/mac-arm64/One Person Lab Preview.app/Contents/MacOS/One Person Lab Preview"
          test -x "$executable"
          file "$executable" | grep -q 'arm64'
          dmg="$(find out -maxdepth 1 -name '*-mac-arm64.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

      - name: Start packaged macOS Desktop and read interaction tree
        shell: bash
        run: |
          OPL_DESKTOP_EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          export OPL_DESKTOP_EXPECTED_VERSION
          npm run smoke:desktop-live
