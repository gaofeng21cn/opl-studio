name: DSH Plugin Composition Test

# Verifies that the latest compatible versions of all OPL DSH Host plugins
# work together against the pinned DSH cohort.
# On pass, produces a composition_receipt.json artifact that the App stable
# release can consume on the shell-unchanged path.
#
# Design: docs/delivery/dsh-plugin-publication.md (in one-person-lab-app)

on:
  workflow_dispatch:
    inputs:
      plugin_versions:
        description: >
          Optional JSON object overriding resolved versions for specific plugins,
          e.g. {"@one-person-lab/opl-superagent":"0.2.1"}.
          Leave empty to resolve latest ^x.y.0 from the registry.
        required: false
        default: ""
  workflow_run:
    workflows: ["Publish DSH Host Plugins"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: opl-studio-composition-test
  cancel-in-progress: true

jobs:
  composition-test:
    name: Resolve, install and smoke-test plugin combination
    # For workflow_run trigger, only run if the upstream publish succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@one-person-lab"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install build tools without compiling local plugins
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_DSH_REGISTRY_PLUGINS: "1"

      - name: Resolve latest compatible plugin versions
        id: resolve
        shell: bash
        run: |
          node --input-type=module << 'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          import semver from "semver";
          import { evaluatePluginCompatibility } from "@deepseek-ai/dsh-app-boot";

          const localManifests = fs.readdirSync("plugins", { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .map(entry => JSON.parse(fs.readFileSync(`plugins/${entry.name}/package.json`, "utf8")))
            .filter(pkg => !pkg.private && pkg.name?.startsWith("@one-person-lab/")
              && pkg.publishConfig?.registry === "https://npm.pkg.github.com");

          const overrides = JSON.parse(process.env.PLUGIN_VERSIONS_INPUT || "{}");

          // Read pinned DSH cohort from local package.json
          const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const dshCohort = rootPkg.dependencies?.["@deepseek-ai/dsh-app-boot"]
            ?.replace(/^[^0-9]*/, "") ?? "unknown";

          // Resolve versions: use override if given, else query registry for latest
          const resolved = {};
          for (const local of localManifests) {
            const pkg = local.name;
            const baseVer = local.version; // e.g. "0.1.0"
            const range = `^${baseVer}`;
            try {
              const spec = overrides[pkg] ?? range;
              if (overrides[pkg] && !semver.valid(spec)) throw new Error("Override must be an exact semantic version");
              const answer = JSON.parse(execFileSync("npm", ["view", `${pkg}@${spec}`, "name", "version", "engines", "peerDependencies", "--json"], { encoding: "utf8" }));
              const manifests = (Array.isArray(answer) ? answer : [answer])
                .filter(row => row?.name === pkg && semver.valid(row.version))
                .sort((a, b) => semver.rcompare(a.version, b.version));
              const selected = manifests.find(row => !evaluatePluginCompatibility(row, {}, dshCohort));
              if (!selected) throw new Error(`No published compatible version matches ${spec}`);
              resolved[pkg] = selected.version;
            } catch (error) {
              throw new Error(`${pkg} could not be resolved from the registry: ${error.message}`);
            }
          }

          console.log("Resolved versions:", JSON.stringify(resolved, null, 2));
          console.log("DSH cohort:", dshCohort);

          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `versions=${JSON.stringify(resolved)}\n` +
            `dsh_cohort=${dshCohort}\n`
          );
          NODE
        env:
          PLUGIN_VERSIONS_INPUT: ${{ inputs.plugin_versions || '{}' }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Emit composition receipt
        id: receipt
        shell: bash
        run: |
          node --input-type=module << 'NODE'
          import fs from "node:fs";

          const versions = JSON.parse(process.env.RESOLVED_VERSIONS);
          const dshCohort = process.env.DSH_COHORT;
          const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          const receipt = {
            schema: "opl_dsh_plugin_composition_receipt.v1",
            dsh_cohort: dshCohort,
            dsh_cohort_package_ref: rootPkg.dependencies?.["@deepseek-ai/dsh-app-boot"],
            plugins: versions,
            tested_at: new Date().toISOString(),
            tested_on_sha: process.env.GITHUB_SHA,
            registry: "https://npm.pkg.github.com",
          };

          fs.writeFileSync("composition_receipt.json", JSON.stringify(receipt, null, 2) + "\n");
          console.log("composition_receipt.json written:");
          console.log(JSON.stringify(receipt, null, 2));
          NODE
        env:
          RESOLVED_VERSIONS: ${{ steps.resolve.outputs.versions }}
          DSH_COHORT: ${{ steps.resolve.outputs.dsh_cohort }}

      - name: Apply receipt and install exact registry composition
        run: |
          node scripts/apply-composition-receipt.mjs --receipt composition_receipt.json
          npm install --package-lock-only --ignore-scripts
          npm ci
          node --input-type=module -e 'import { buildDshPlugins } from "./scripts/build-dsh-plugins.mjs"; buildDshPlugins(["opl-superagent-engine"]);'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_DSH_REGISTRY_PLUGINS: "1"

      - name: Verify exact registry versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt = JSON.parse(fs.readFileSync("composition_receipt.json", "utf8"));
          for (const [pkg, version] of Object.entries(receipt.plugins)) {
            const installed = JSON.parse(fs.readFileSync(`node_modules/${pkg}/package.json`, "utf8"));
            if (installed.version !== version) throw new Error(`Expected ${pkg}@${version}, found ${installed.version}`);
            console.log(`OK: ${pkg}@${installed.version}`);
          }
          NODE

      - name: Set up pnpm (required by DSH profile resolution)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: "9"

      - name: Run DSH plugin packages boot test
        run: OPL_PLUGIN_COMPOSITION_MODE=registry node --test scripts/dsh-plugin-packages.test.mjs
        timeout-minutes: 5

      - name: Upload composition receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-plugin-composition-receipt
          path: composition_receipt.json
          if-no-files-found: error
          retention-days: 90
