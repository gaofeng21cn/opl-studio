name: OPL Studio WebUI Latest Alias

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: opl-studio-webui-preview
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gaofeng21cn/opl-studio-webui

jobs:
  promote:
    name: Point latest at qualified Preview
    runs-on: ubuntu-24.04
    steps:
      - name: Check out canonical Studio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify current Preview digest
        id: target
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE:preview" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "${digest#sha256:}" != "$digest"
          cosign verify \
            --certificate-identity "https://github.com/gaofeng21cn/opl-studio/.github/workflows/studio-webui-preview.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE@$digest" > /dev/null
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Move latest to the signed Preview digest
        shell: bash
        env:
          DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$DIGEST"

      - name: Read back latest anonymously
        shell: bash
        env:
          DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$DIGEST"
