name: OPL Studio WebUI Preview OCI

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: opl-studio-webui-preview
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gaofeng21cn/opl-studio-webui

jobs:
  source-gate:
    name: Freeze Preview source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.cohort.outputs.version }}
      app_ref: ${{ steps.cohort.outputs.app_ref }}
      framework_ref: ${{ steps.cohort.outputs.framework_ref }}
      dsh_ref: ${{ steps.cohort.outputs.dsh_ref }}
    steps:
      - name: Check out canonical Studio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require canonical main and unused version tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          version="$(node -p 'require("./package.json").version')"
          test "$version" = 0.1.6
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Git tag v${version} already exists; increment the Studio version before publishing." >&2
            exit 1
          fi

      - name: Check out canonical Framework cohort
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: main
          path: .cohort/framework
          persist-credentials: false

      - name: Check out canonical App cohort
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: main
          path: .cohort/app
          persist-credentials: false

      - name: Check out canonical AionUI cohort
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: main
          path: .cohort/aionui
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install and validate source
        env:
          OPL_FRAMEWORK_REPO: ${{ github.workspace }}/.cohort/framework
          OPL_APP_REPO: ${{ github.workspace }}/.cohort/app
          OPL_AIONUI_REPO: ${{ github.workspace }}/.cohort/aionui
        run: |
          npm ci
          npm run typecheck
          npm run test:oci
          npm run validate:client-conformance

      - name: Export exact cohort
        id: cohort
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = JSON.parse(fs.readFileSync("src/candidateContractEvidence.json", "utf8"));
          const cohort = evidence.candidate_runtime_qualification?.external_cohort ?? {};
          const output = {
            version: JSON.parse(fs.readFileSync("package.json", "utf8")).version,
            app_ref: cohort.app_commit,
            framework_ref: cohort.framework_commit,
            dsh_ref: evidence.application_host?.upstream_ref
          };
          for (const [key, value] of Object.entries(output)) {
            if (key !== "version" && !/^[0-9a-f]{40}$/.test(value ?? "")) throw new Error(`invalid ${key}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

  build-child:
    name: Build and smoke ${{ matrix.platform }}
    needs: source-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out exact Studio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native child with SBOM and max provenance
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          build-args: |
            OPL_SOURCE_REVISION=${{ github.sha }}
            OPL_FRAMEWORK_REF=${{ needs.source-gate.outputs.framework_ref }}
            OPL_APP_REF=${{ needs.source-gate.outputs.app_ref }}

      - name: Smoke exact pushed child
        id: child
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # The hosted runner needs room to pull the exact pushed image and create
          # its persistent volumes after BuildKit has finished exporting attestations.
          docker buildx prune --all --force
          raw="$RUNNER_TEMP/build-index.json"
          docker buildx imagetools inspect "$IMAGE@$BUILD_DIGEST" --raw > "$raw"
          child_digest="$(jq -er --arg arch '${{ matrix.architecture }}' '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' "$raw")"
          printf 'digest=%s\n' "$child_digest" >> "$GITHUB_OUTPUT"
          export OPL_CLOUD_SMOKE_IMAGE="$IMAGE@$child_digest"
          docker pull "$OPL_CLOUD_SMOKE_IMAGE"
          node tests/headless/docker-cloud-smoke.mjs

      - name: Export child digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          build_digest='${{ steps.build.outputs.digest }}'
          child_digest='${{ steps.child.outputs.digest }}'
          test "${build_digest#sha256:}" != "$build_digest"
          test "${child_digest#sha256:}" != "$child_digest"
          printf '%s\n' "$build_digest" > "$RUNNER_TEMP/digests/${{ matrix.architecture }}-build"
          printf '%s\n' "$child_digest" > "$RUNNER_TEMP/digests/${{ matrix.architecture }}-child"

      - name: Upload child digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-studio-webui-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/digests/${{ matrix.architecture }}-*
          if-no-files-found: error
          retention-days: 7

  package-visibility:
    name: Verify Preview package is public
    needs: build-child
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download native child digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opl-studio-webui-*-${{ github.sha }}
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Verify anonymous exact-digest access
        shell: bash
        run: |
          set -euo pipefail
          child_digest="$(cat "$RUNNER_TEMP/digests/amd64-child")"
          test "${child_digest#sha256:}" != "$child_digest"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker buildx imagetools inspect "$IMAGE@$child_digest" --raw > "$RUNNER_TEMP/public-child.json"
          jq -e '.schemaVersion == 2' "$RUNNER_TEMP/public-child.json" > /dev/null

  publish-index:
    name: Sign and publish Preview index
    needs: [source-gate, build-child, package-visibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      index_digest: ${{ steps.index.outputs.index_digest }}
      amd64_digest: ${{ steps.index.outputs.amd64_digest }}
      arm64_digest: ${{ steps.index.outputs.arm64_digest }}
    steps:
      - name: Check out exact Studio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download native child digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opl-studio-webui-*-${{ github.sha }}
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create immutable multi-architecture index
        id: index
        shell: bash
        env:
          VERSION: ${{ needs.source-gate.outputs.version }}
        run: |
          set -euo pipefail
          amd64_build_digest="$(cat "$RUNNER_TEMP/digests/amd64-build")"
          arm64_build_digest="$(cat "$RUNNER_TEMP/digests/arm64-build")"
          expected_amd64_digest="$(cat "$RUNNER_TEMP/digests/amd64-child")"
          expected_arm64_digest="$(cat "$RUNNER_TEMP/digests/arm64-child")"
          for tag in "v${VERSION}" "sha-${GITHUB_SHA}"; do
            if docker buildx imagetools inspect "$IMAGE:$tag" >/dev/null 2>&1; then
              echo "Immutable OCI tag $IMAGE:$tag already exists; refusing to move it." >&2
              exit 1
            fi
          done
          docker buildx imagetools create \
            --tag "$IMAGE:v${VERSION}" \
            --tag "$IMAGE:sha-${GITHUB_SHA}" \
            "$IMAGE@$amd64_build_digest" \
            "$IMAGE@$arm64_build_digest"
          index_digest="$(docker buildx imagetools inspect "$IMAGE:v${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$index_digest" = "$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          raw="$RUNNER_TEMP/index.json"
          docker buildx imagetools inspect "$IMAGE@$index_digest" --raw > "$raw"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "$raw")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "$raw")"
          test "$amd64_digest" = "$expected_amd64_digest"
          test "$arm64_digest" = "$expected_arm64_digest"
          {
            printf 'index_digest=%s\n' "$index_digest"
            printf 'amd64_digest=%s\n' "$amd64_digest"
            printf 'arm64_digest=%s\n' "$arm64_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Verify index platforms and BuildKit attestations
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.index_digest }}
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/index.json"
          docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw > "$raw"
          jq -e '([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | unique) == ["amd64", "arm64"]' "$raw"
          for digest in '${{ steps.index.outputs.amd64_digest }}' '${{ steps.index.outputs.arm64_digest }}'; do
            jq -e --arg digest "$digest" '([.manifests[] | select(.platform.os == "unknown" and .platform.architecture == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $digest)] | length) >= 1' "$raw"
          done

      - name: Sign and verify index and native children
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.index_digest }}
          AMD64_DIGEST: ${{ steps.index.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.index.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/gaofeng21cn/opl-studio/.github/workflows/studio-webui-preview.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          for digest in "$INDEX_DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            cosign sign --yes "$IMAGE@$digest"
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$IMAGE@$digest" > /dev/null
          done

  anonymous-smoke:
    name: Anonymous native smoke ${{ matrix.platform }}
    needs: publish-index
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            digest_output: amd64_digest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_output: arm64_digest
    steps:
      - name: Check out exact Studio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"

      - name: Pull and smoke the public immutable child
        shell: bash
        env:
          CHILD_DIGEST: ${{ needs.publish-index.outputs[matrix.digest_output] }}
        run: |
          set -euo pipefail
          test "${CHILD_DIGEST#sha256:}" != "$CHILD_DIGEST"
          docker logout ghcr.io >/dev/null 2>&1 || true
          export OPL_CLOUD_SMOKE_IMAGE="$IMAGE@$CHILD_DIGEST"
          docker pull "$OPL_CLOUD_SMOKE_IMAGE"
          node tests/headless/docker-cloud-smoke.mjs

  finalize-preview:
    name: Finalize Preview handoff
    needs: [source-gate, publish-index, anonymous-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Studio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve previous Preview digest
        id: previous
        shell: bash
        run: |
          previous="$(docker buildx imagetools inspect "$IMAGE:preview" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          if test -n "$previous"; then printf 'digest=%s\n' "$previous" >> "$GITHUB_OUTPUT"; fi

      - name: Move Preview aliases only after native anonymous acceptance
        shell: bash
        env:
          INDEX_DIGEST: ${{ needs.publish-index.outputs.index_digest }}
        run: |
          for tag in preview latest; do
            docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$INDEX_DIGEST"
            test "$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$INDEX_DIGEST"
          done

      - name: Read back public index, children, and tags anonymously
        shell: bash
        env:
          VERSION: ${{ needs.source-gate.outputs.version }}
          INDEX_DIGEST: ${{ needs.publish-index.outputs.index_digest }}
          AMD64_DIGEST: ${{ needs.publish-index.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.publish-index.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          for tag in "v${VERSION}" "sha-${GITHUB_SHA}" preview latest; do
            test "$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$INDEX_DIGEST"
          done
          for digest in "$INDEX_DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            docker buildx imagetools inspect "$IMAGE@$digest" --raw > /dev/null
          done

      - name: Generate Cloud workspace handoff
        shell: bash
        env:
          VERSION: ${{ needs.source-gate.outputs.version }}
          APP_REF: ${{ needs.source-gate.outputs.app_ref }}
          FRAMEWORK_REF: ${{ needs.source-gate.outputs.framework_ref }}
          DSH_REF: ${{ needs.source-gate.outputs.dsh_ref }}
          INDEX_DIGEST: ${{ needs.publish-index.outputs.index_digest }}
          AMD64_DIGEST: ${{ needs.publish-index.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.publish-index.outputs.arm64_digest }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
        run: |
          set -euo pipefail
          args=(
            --version "$VERSION"
            --studio-ref "$GITHUB_SHA"
            --app-ref "$APP_REF"
            --framework-ref "$FRAMEWORK_REF"
            --dsh-ref "$DSH_REF"
            --index-digest "$INDEX_DIGEST"
            --amd64-digest "$AMD64_DIGEST"
            --arm64-digest "$ARM64_DIGEST"
            --verification passed
          )
          if test -n "$PREVIOUS_DIGEST"; then args+=(--previous-digest "$PREVIOUS_DIGEST"); fi
          mkdir -p out
          node scripts/oci/handoff.mjs "${args[@]}" > out/opl-studio-cloud-workspace-image-handoff.json
          jq -e --arg digest "$INDEX_DIGEST" '.schema == "opl_studio_cloud_workspace_image_handoff.v1" and .image.index_digest == $digest and .adoption.release_ready == false' out/opl-studio-cloud-workspace-image-handoff.json

      - name: Upload Cloud handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-studio-cloud-workspace-image-handoff-${{ github.sha }}
          path: out/opl-studio-cloud-workspace-image-handoff.json
          if-no-files-found: error
          retention-days: 30
