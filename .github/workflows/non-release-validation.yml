name: OPL Studio Source Validation

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-studio-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source, contract, and unit validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product

    steps:
      - name: Checkout Studio candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned App product cohort
        id: app-cohort
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = JSON.parse(fs.readFileSync("src/candidateContractEvidence.json", "utf8"));
          const appCommit = evidence.candidate_runtime_qualification?.external_cohort?.app_commit;
          if (!/^[0-9a-f]{40}$/.test(appCommit ?? "")) throw new Error("missing exact App product cohort commit");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${appCommit}\n`);
          NODE

      - name: Checkout pinned App product contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ steps.app-cohort.outputs.sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Run source-only validation
        run: npm run test:source
