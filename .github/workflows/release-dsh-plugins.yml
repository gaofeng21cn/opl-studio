name: Publish DSH Host Plugins

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "src/**"
      - "scripts/build-dsh-plugins.mjs"
      - "scripts/vite-build-renderer-entry.mjs"
      - "scripts/client-runtime-policy.mjs"
      - "scripts/build-dsh-client.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-dsh-plugins.yml"
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Comma-separated plugin directory names to publish (e.g. opl-superagent,opl-host-core).
          Leave empty to publish all changed packages detected from the last commit.
        required: false
        default: ""
      force_all:
        description: Publish every publishable plugin regardless of change detection.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write   # for npm provenance attestation

concurrency:
  group: opl-studio-plugin-publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed plugins
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_plugins: ${{ steps.detect.outputs.has_plugins }}
      app_sha: ${{ steps.app-source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve App product source
        id: app-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_sha="$(gh api repos/gaofeng21cn/one-person-lab-app/commits/main --jq .sha)"
          [[ "$app_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$app_sha" >> "$GITHUB_OUTPUT"

      - name: Detect changed plugins
        id: detect
        shell: bash
        run: |
          node --input-type=module << 'NODE'
          import fs from "node:fs";
          import { execSync } from "node:child_process";

          const PUBLISHABLE = fs.readdirSync("plugins", { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .filter(entry => {
              const pkg = JSON.parse(fs.readFileSync(`plugins/${entry.name}/package.json`, "utf8"));
              return !pkg.private && pkg.name?.startsWith("@gaofeng21cn/")
                && pkg.publishConfig?.registry === "https://npm.pkg.github.com";
            }).map(entry => entry.name);

          const forceAll = process.env.FORCE_ALL === "true";
          const explicitInput = (process.env.PACKAGES_INPUT || "").trim();

          let selected;
          if (forceAll) {
            selected = PUBLISHABLE;
          } else if (explicitInput) {
            selected = [...new Set(explicitInput.split(",").map(s => s.trim()))];
            const unknown = selected.filter(name => !PUBLISHABLE.includes(name));
            if (unknown.length) throw new Error(`Not publishable source packages: ${unknown.join(", ")}`);
          } else {
            const changed = execSync("git diff --name-only HEAD~1 HEAD", { encoding: "utf8" }).trim().split("\n");
            // Host/client plugins bundle shared adapters from src. A shared
            // source or build-input change therefore affects every package.
            const sharedChanged = changed.some(file => !file.startsWith("plugins/"));
            selected = sharedChanged ? PUBLISHABLE : PUBLISHABLE.filter(name => changed.some(f => f.startsWith(`plugins/${name}/`)));
          }

          const matrix = { include: selected.map(name => ({ plugin: name })) };
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `matrix=${JSON.stringify(matrix)}\n`);
          fs.appendFileSync(output, `has_plugins=${selected.length > 0}\n`);
          console.log(`Selected plugins: ${selected.join(", ") || "(none)"}`);
          NODE
        env:
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          PACKAGES_INPUT: ${{ inputs.packages || '' }}

  publish:
    name: Build and publish ${{ matrix.plugin }}
    needs: detect
    if: needs.detect.outputs.has_plugins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout selected App product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ needs.detect.outputs.app_sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@gaofeng21cn"

      - name: Set up Bun (required by build:plugins)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Set up pnpm for native profile validation
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: "9"

      - name: Build plugin
        # buildDshPlugins() accepts a directory name filter.
        # Calling via --input-type avoids running the whole-build CLI entrypoint.
        run: |
          node --input-type=module << 'NODE'
          import { buildDshPlugins } from "./scripts/build-dsh-plugins.mjs";
          buildDshPlugins(["${{ matrix.plugin }}"]);
          NODE

      - name: Run plugin package tests
        run: node --test scripts/dsh-plugin-packages.test.mjs

      - name: Check version not already published
        id: version-check
        shell: bash
        run: |
          PKG_NAME=$(node -p "require('./plugins/${{ matrix.plugin }}/package.json').name")
          PKG_VERSION=$(node -p "require('./plugins/${{ matrix.plugin }}/package.json').version")
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry https://npm.pkg.github.com 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG_NAME}@${PKG_VERSION} is already published — skipping."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.version-check.outputs.already_published == 'false'
        # npm treats a positional path after `publish` as a package spec in
        # this runner's npm version. Enter the package directory so the
        # publish target is unambiguous and never becomes github:plugins/...
        run: cd plugins/${{ matrix.plugin }} && npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record published version
        if: steps.version-check.outputs.already_published == 'false'
        run: |
          echo "Published ${{ steps.version-check.outputs.pkg_name }}@${{ steps.version-check.outputs.pkg_version }}"
