name: Publish DSH Host Plugins

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "packages/**"
      - "vendor/**"
      - "src/**"
      - "scripts/build-dsh-plugins.mjs"
      - "scripts/vite-build-renderer-entry.mjs"
      - "scripts/client-runtime-policy.mjs"
      - "scripts/build-dsh-client.mjs"
      - "scripts/check-plugin-publication.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-dsh-plugins.yml"
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Comma-separated plugin directory names to publish (e.g. opl-superagent,opl-host-core).
          Leave empty to publish all changed packages detected from the last commit.
        required: false
        default: ""
      force_all:
        description: Publish every publishable plugin regardless of change detection.
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write   # for npm provenance attestation

concurrency:
  group: opl-studio-plugin-publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed plugins
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      has_plugins: ${{ steps.detect.outputs.has_plugins }}
      app_sha: ${{ steps.app-source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve App product source
        id: app-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_sha="$(gh api repos/gaofeng21cn/one-person-lab-app/commits/main --jq .sha)"
          [[ "$app_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$app_sha" >> "$GITHUB_OUTPUT"

      - name: Detect changed plugins
        id: detect
        shell: bash
        run: |
          node --input-type=module << 'NODE'
          import fs from "node:fs";
          import { execFileSync, spawnSync } from "node:child_process";

          const PUBLISHABLE = fs.readdirSync("plugins", { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .filter(entry => {
              const pkg = JSON.parse(fs.readFileSync(`plugins/${entry.name}/package.json`, "utf8"));
              return !pkg.private && pkg.name?.startsWith("@gaofeng21cn/")
                && pkg.publishConfig?.registry === "https://npm.pkg.github.com";
            }).map(entry => entry.name);

          const forceAll = process.env.FORCE_ALL === "true";
          const explicitInput = (process.env.PACKAGES_INPUT || "").trim();

          let selected;
          if (forceAll) {
            selected = PUBLISHABLE;
          } else if (explicitInput) {
            selected = [...new Set(explicitInput.split(",").map(s => s.trim()))];
            const unknown = selected.filter(name => !PUBLISHABLE.includes(name));
            if (unknown.length) throw new Error(`Not publishable source packages: ${unknown.join(", ")}`);
          } else {
            const base = process.env.PUSH_BASE || "HEAD~1";
            const hasBase = () => spawnSync("git", ["cat-file", "-e", `${base}^{commit}`], { stdio: "ignore" }).status === 0;
            if (/^(?!0{40}$)[0-9a-f]{40}$/.test(base) && !hasBase()) {
              spawnSync("git", ["fetch", "--depth=1", "--no-tags", "origin", base], { stdio: "inherit" });
            }
            const changed = hasBase()
              ? execFileSync("git", ["diff", "--name-only", "--no-renames", base, "HEAD"], { encoding: "utf8" }).trim().split("\n").filter(Boolean)
              : null;
            // Test-only changes and edits to this workflow do not change a package's bytes.
            const packageInputs = changed?.filter(file =>
              file !== ".github/workflows/release-dsh-plugins.yml" &&
              !(file.startsWith("src/") && file.endsWith(".test.mjs"))
            );
            const sharedChanged = packageInputs?.some(file => !file.startsWith("plugins/"));
            selected = !packageInputs || sharedChanged
              ? PUBLISHABLE
              : PUBLISHABLE.filter(name => packageInputs.some(file => file.startsWith(`plugins/${name}/`)));
          }

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `plugins=${JSON.stringify(selected)}\n`);
          fs.appendFileSync(output, `has_plugins=${selected.length > 0}\n`);
          console.log(`Selected plugins: ${selected.join(", ") || "(none)"}`);
          NODE
        env:
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          PACKAGES_INPUT: ${{ inputs.packages || '' }}
          PUSH_BASE: ${{ github.event.before }}

  publish:
    name: Build, test and publish selected DSH plugins
    needs: detect
    if: github.ref == 'refs/heads/main' && needs.detect.outputs.has_plugins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout selected App product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ needs.detect.outputs.app_sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@gaofeng21cn"

      - name: Set up Bun (required by build:plugins)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies and build the plugin set
        run: npm ci

      - name: Set up pnpm for native profile validation
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "9"

      - name: Run plugin package tests
        run: node --test scripts/dsh-plugin-packages.test.mjs scripts/dsh-child-profile-packages.test.mjs

      - name: Check version not already published
        id: version-check
        shell: bash
        run: |
          node --input-type=module << 'NODE'
          import fs from "node:fs";
          import { inspectPublication } from "./scripts/check-plugin-publication.mjs";
          const unpublished = [];
          for (const id of JSON.parse(process.env.SELECTED_PLUGINS)) {
            const publication = inspectPublication(`plugins/${id}`);
            console.log(JSON.stringify(publication));
            if (publication.status === "unpublished") unpublished.push(id);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `plugins=${JSON.stringify(unpublished)}\n`);
          NODE
        env:
          SELECTED_PLUGINS: ${{ needs.detect.outputs.plugins }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.version-check.outputs.plugins != '[]'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$UNPUBLISHED_PLUGINS" | while IFS= read -r plugin; do
            (cd "plugins/$plugin" && npm publish --provenance)
          done
        env:
          UNPUBLISHED_PLUGINS: ${{ steps.version-check.outputs.plugins }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish public DSH plugin feed
        if: steps.version-check.outputs.plugins != '[]' || inputs.force_all == true
        shell: bash
        run: node scripts/publish-dsh-plugin-feed.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
