name: Publish DSH Host Plugins

on:
  push:
    branches:
      - main
    paths:
      - "plugins/*/*/package.json"
      - "packages/*/package.json"
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Comma-separated plugin directory names to publish (e.g. opl-superagent,opl-host-core).
          Leave empty to publish packages whose version changed in the last commit.
        required: false
        default: ""
      force_all:
        description: Publish every publishable plugin regardless of change detection.
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write   # for npm provenance attestation

concurrency:
  group: opl-studio-plugin-publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed plugins
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      has_plugins: ${{ steps.detect.outputs.has_plugins }}
      sdk_packages: ${{ steps.detect.outputs.sdk_packages }}
      has_sdk: ${{ steps.detect.outputs.has_sdk }}
      app_sha: ${{ steps.app-source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed plugins
        id: detect
        shell: bash
        run: |
          node --input-type=module << 'NODE'
          import fs from "node:fs";
          import { execFileSync, spawnSync } from "node:child_process";

          import { listDshSourcePackages } from "./packages/host-kit/src/dsh-source-packages.mjs";

          const descriptors = listDshSourcePackages(process.cwd()).filter(({ manifest: pkg }) =>
            !pkg.private && pkg.name?.startsWith("@gaofeng21cn/")
              && pkg.publishConfig?.registry === "https://npm.pkg.github.com");
          const PUBLISHABLE = descriptors.map(({ id }) => id);

          const PUBLISHABLE_SDKS = fs.readdirSync("packages", { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .filter(entry => {
              const pkg = JSON.parse(fs.readFileSync(`packages/${entry.name}/package.json`, "utf8"));
              return !pkg.private && pkg.name?.startsWith("@gaofeng21cn/")
                && pkg.publishConfig?.registry === "https://npm.pkg.github.com";
            }).map(entry => entry.name);

          const forceAll = process.env.FORCE_ALL === "true";
          const explicitInput = (process.env.PACKAGES_INPUT || "").trim();

          let selected;
          let selectedSdks;
          if (forceAll) {
            selected = PUBLISHABLE;
            selectedSdks = PUBLISHABLE_SDKS;
          } else if (explicitInput) {
            const requested = [...new Set(explicitInput.split(",").map(s => s.trim()))];
            selected = requested.filter(name => PUBLISHABLE.includes(name));
            selectedSdks = requested.filter(name => PUBLISHABLE_SDKS.includes(name));
            const unknown = requested.filter(name => !PUBLISHABLE.includes(name) && !PUBLISHABLE_SDKS.includes(name));
            if (unknown.length) throw new Error(`Not publishable source packages: ${unknown.join(", ")}`);
          } else {
            const base = process.env.PUSH_BASE || "HEAD~1";
            const hasBase = () => spawnSync("git", ["cat-file", "-e", `${base}^{commit}`], { stdio: "ignore" }).status === 0;
            if (/^(?!0{40}$)[0-9a-f]{40}$/.test(base) && !hasBase()) {
              spawnSync("git", ["fetch", "--depth=1", "--no-tags", "origin", base], { stdio: "inherit" });
            }
            if (!hasBase() && base !== "0".repeat(40)) {
              throw new Error("Cannot resolve the prior revision for package version detection");
            }
            function hasNewVersion(directory, oldDirectory) {
              const manifestPath = directory + "/package.json";
              const current = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              // Existing packages can move between source groups without republishing the same version.
              const oldPluginPath = oldDirectory ? `${oldDirectory}/package.json` : null;
              const priorRef = [manifestPath, oldPluginPath].filter(Boolean).map(file => `${base}:${file}`)
                .find(ref => spawnSync("git", ["cat-file", "-e", ref], { stdio: "ignore" }).status === 0);
              if (!priorRef) return true;
              const previous = JSON.parse(execFileSync("git", ["show", priorRef], { encoding: "utf8" }));
              return current.name !== previous.name || current.version !== previous.version;
            }
            // Source changes flow through source validation. Package publication follows version changes.
            selected = descriptors.filter(({ id, relativeDirectory }) => hasNewVersion(relativeDirectory, `plugins/${id}`)).map(({ id }) => id);
            selectedSdks = PUBLISHABLE_SDKS.filter(name => hasNewVersion("packages/" + name));
          }

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `plugins=${JSON.stringify(selected)}\n`);
          fs.appendFileSync(output, `has_plugins=${selected.length > 0}\n`);
          fs.appendFileSync(output, `sdk_packages=${JSON.stringify(selectedSdks)}\n`);
          fs.appendFileSync(output, `has_sdk=${selectedSdks.length > 0}\n`);
          console.log(`Selected plugins: ${selected.join(", ") || "(none)"}`);
          console.log(`Selected SDK packages: ${selectedSdks.join(", ") || "(none)"}`);
          NODE
        env:
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          PACKAGES_INPUT: ${{ inputs.packages || '' }}
          PUSH_BASE: ${{ github.event.before }}

      - name: Resolve App product source
        id: app-source
        if: steps.detect.outputs.has_plugins == 'true' || steps.detect.outputs.has_sdk == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_sha="$(gh api repos/gaofeng21cn/one-person-lab-app/commits/main --jq .sha)"
          [[ "$app_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$app_sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, test and publish selected DSH plugins
    needs: detect
    if: github.ref == 'refs/heads/main' && (needs.detect.outputs.has_plugins == 'true' || needs.detect.outputs.has_sdk == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPL_APP_REPO_ROOT: ${{ github.workspace }}/app-product
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout selected App product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab-app
          ref: ${{ needs.detect.outputs.app_sha }}
          path: app-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@gaofeng21cn"

      - name: Set up Bun (required by build:plugins)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies and build the plugin set
        run: npm ci

      - name: Set up pnpm for native profile validation
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "9"

      - name: Run plugin package tests
        run: node --test scripts/dsh-plugin-packages.test.mjs scripts/dsh-child-profile-packages.test.mjs

      - name: Check version not already published
        id: version-check
        shell: bash
        run: |
          node --input-type=module << 'NODE'
          import fs from "node:fs";
          import { inspectPublication } from "./scripts/check-plugin-publication.mjs";
          import { listDshSourcePackages } from "./packages/host-kit/src/dsh-source-packages.mjs";
          const directories = new Map(listDshSourcePackages(process.cwd()).map(({ id, directory }) => [id, directory]));
          const unpublished = [];
          for (const id of JSON.parse(process.env.SELECTED_PLUGINS)) {
            const publication = inspectPublication(directories.get(id));
            console.log(JSON.stringify(publication));
            if (publication.status === "unpublished") unpublished.push(id);
          }
          const unpublishedSdks = [];
          for (const id of JSON.parse(process.env.SELECTED_SDKS)) {
            const publication = inspectPublication(`packages/${id}`);
            console.log(JSON.stringify(publication));
            if (publication.status === "unpublished") unpublishedSdks.push(id);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `plugins=${JSON.stringify(unpublished)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sdk_packages=${JSON.stringify(unpublishedSdks)}\n`);
          NODE
        env:
          SELECTED_PLUGINS: ${{ needs.detect.outputs.plugins }}
          SELECTED_SDKS: ${{ needs.detect.outputs.sdk_packages }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.version-check.outputs.plugins != '[]' || steps.version-check.outputs.sdk_packages != '[]'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$UNPUBLISHED_SDKS" | while IFS= read -r pkg; do
            (cd "packages/$pkg" && npm publish --provenance)
          done
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { listDshSourcePackages } from "./packages/host-kit/src/dsh-source-packages.mjs";
          const directories = new Map(listDshSourcePackages(process.cwd()).map(({ id, directory }) => [id, directory]));
          for (const id of JSON.parse(process.env.UNPUBLISHED_PLUGINS)) {
            const cwd = directories.get(id);
            if (!cwd) throw new Error(`Unknown DSH source package: ${id}`);
            execFileSync("npm", ["publish", "--provenance"], { cwd, stdio: "inherit" });
          }
          NODE
        env:
          UNPUBLISHED_PLUGINS: ${{ steps.version-check.outputs.plugins }}
          UNPUBLISHED_SDKS: ${{ steps.version-check.outputs.sdk_packages }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish public DSH plugin feed
        if: needs.detect.outputs.has_plugins == 'true'
        shell: bash
        run: node scripts/publish-dsh-plugin-feed.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_PLUGINS: ${{ needs.detect.outputs.plugins }}
