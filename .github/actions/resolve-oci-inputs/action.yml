name: Resolve OCI build inputs
description: Check out the selected App and Framework and freeze their Codex npm selection for native builds.
outputs:
  app_ref:
    description: App product commit
    value: ${{ steps.pinned-cohort.outputs.app_ref }}
  framework_ref:
    description: Framework commit
    value: ${{ steps.pinned-cohort.outputs.framework_ref }}
  codex_npm_spec:
    description: Exact Codex npm package used by both native builds
    value: ${{ steps.codex.outputs.spec }}
runs:
  using: composite
  steps:
    - name: Read pinned release cohort
      id: pinned-cohort
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import fs from "node:fs";
        const evidence = JSON.parse(fs.readFileSync("src/candidateContractEvidence.json", "utf8"));
        const cohort = evidence.candidate_runtime_qualification?.external_cohort ?? {};
        for (const name of ["framework", "app"]) {
          const commit = cohort[`${name}_commit`];
          if (!/^[0-9a-f]{40}$/.test(commit ?? "")) throw new Error(`invalid ${name} cohort`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}_ref=${commit}\n`);
        }
        NODE

    - name: Check out pinned Framework cohort
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: gaofeng21cn/one-person-lab
        ref: ${{ steps.pinned-cohort.outputs.framework_ref }}
        path: .cohort/framework
        persist-credentials: false

    - name: Check out pinned App cohort
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: gaofeng21cn/one-person-lab-app
        ref: ${{ steps.pinned-cohort.outputs.app_ref }}
        path: .cohort/app
        persist-credentials: false

    - name: Resolve the Codex npm package through the pinned App and Framework
      id: codex
      shell: bash
      run: |
        (cd .cohort/framework && npm ci --ignore-scripts --no-audit --no-fund)
        node .cohort/app/scripts/resolve-build-dependencies.ts \
          --app-root .cohort/app --framework-root .cohort/framework \
          --dependency codex-cli --platform linux --arch x64 --output "$RUNNER_TEMP/oci-inputs"
        spec="$(jq -er '.runtime_payloads.codex_cli | select(.package == "@openai/codex") |
          select(.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | "\(.package)@\(.version)"' \
          "$RUNNER_TEMP/oci-inputs/qualification-input-manifest.json")"
        printf 'spec=%s\n' "$spec" >> "$GITHUB_OUTPUT"
