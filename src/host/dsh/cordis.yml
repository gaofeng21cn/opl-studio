- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: native

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: !!js ctx.oplStudioHostOptions.webHost ?? '127.0.0.1'
    port: !!js ctx.oplStudioHostOptions.webPort ?? 0

- id: opl-dsh-tool-mcp
  name: '@one-person-lab/opl-dsh-tool-mcp'

- id: opl-codex-native
  name: '@one-person-lab/opl-codex-native'

- id: opl-framework-bridge
  name: '@one-person-lab/opl-framework-bridge'

- id: opl-mcp-apps
  name: '@one-person-lab/opl-mcp-apps'

- id: opl-host-core
  name: '@one-person-lab/opl-host-core'

- id: plugin-inventory
  name: '@deepseek-ai/dsh-host-plugin-inventory'
