- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: tool-executor-native
  name: '@deepseek-ai/dsh-tool-executor-native'

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: !!js ctx.oplStudioHostOptions.webHost ?? '127.0.0.1'
    port: !!js ctx.oplStudioHostOptions.webPort ?? 0

- id: opl-dsh-tool-mcp
  name: '@one-person-lab/opl-dsh-tool-mcp'

- id: opl-codex-native
  name: '@one-person-lab/opl-codex-native'

- id: opl-framework-bridge
  name: '@one-person-lab/opl-framework-bridge'

- id: opl-mcp-apps
  name: '@one-person-lab/opl-mcp-apps'

- id: opl-host-core
  name: '@one-person-lab/opl-host-core'

# DSH's official client module registry composes the dsh.client declarations
# from the active profile. Desktop uses its graph through the native bridge;
# WebUI uses the same service through the static frontend route.
- id: client-modules
  name: '@deepseek-ai/dsh-client-modules'

- id: opl-studio-client
  name: '@one-person-lab/opl-studio-client'

- id: plugin-inventory
  name: '@deepseek-ai/dsh-host-plugin-inventory'

# Collaboration launches the unchanged official base/web application on demand.
# Its adapter borrows the existing Codex transport; the main profile stays Codex-only.
- id: opl-team-bots
  name: '@one-person-lab/opl-team-bots'

- id: opl-superagent
  name: '@one-person-lab/opl-superagent'
