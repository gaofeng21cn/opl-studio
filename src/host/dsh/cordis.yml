- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: tool-executor-native
  name: '@deepseek-ai/dsh-tool-executor-native'

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: !!js ctx.oplStudioHostOptions.webHost ?? '127.0.0.1'
    port: !!js ctx.oplStudioHostOptions.webPort ?? 0

- id: opl-dsh-tool-mcp
  name: '@one-person-lab/opl-dsh-tool-mcp'

- id: opl-codex-native
  name: '@one-person-lab/opl-codex-native'

- id: opl-framework-bridge
  name: '@one-person-lab/opl-framework-bridge'

- id: opl-mcp-apps
  name: '@one-person-lab/opl-mcp-apps'

- id: opl-host-core
  name: '@one-person-lab/opl-host-core'

- id: plugin-inventory
  name: '@deepseek-ai/dsh-host-plugin-inventory'

# Official collaboration services use an isolated native tool registry. Normal
# Codex conversations keep the existing MCP registry and cannot call Team tools.
- id: collaboration
  name: cordis:group
  group: true
  isolate:
    tools: true
  config:
    - id: collaboration-tools
      name: '@deepseek-ai/dsh-tools'
    - id: collaboration-tool-executor
      name: '@deepseek-ai/dsh-tool-executor-native'
    - id: collaboration-llm
      name: '@deepseek-ai/dsh-llm'
    - id: collaboration-session
      name: '@deepseek-ai/dsh-session'
    - id: collaboration-projections
      name: '@deepseek-ai/dsh-session-projection'
    - id: collaboration-persistence
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js ctx.oplStudioHostOptions.dshHome + '/opl/sessions'
    - id: collaboration-query
      name: '@deepseek-ai/dsh-session-query'
    - id: collaboration-agents
      name: '@deepseek-ai/dsh-agent'
    - id: collaboration-agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
    - id: collaboration-fs
      name: '@deepseek-ai/dsh-fs-local'
    - id: collaboration-working-directory
      name: '@deepseek-ai/dsh-working-directory'
    - id: collaboration-subagents
      name: '@deepseek-ai/dsh-subagent'
    - id: collaboration-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
    - id: collaboration-delegate
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        maxDepth: 4
    - id: collaboration-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      config:
        interrupt: true
    - id: collaboration-team
      name: '@deepseek-ai/dsh-agent-team'
    - id: collaboration-team-tools
      name: '@deepseek-ai/dsh-tool-agent-team'
    - id: opl-codex-agents
      name: '@one-person-lab/opl-codex-agents'
    - id: opl-team-bots
      name: '@one-person-lab/opl-team-bots'

- id: opl-superagent
  name: '@one-person-lab/opl-superagent'
