appId: cn.onepersonlab.opl.studio.preview
productName: One Person Lab Preview
asar: true
asarUnpack:
  - desktop/**/*
  - src/host/**/*
  - packages/host-kit/**/*.mjs
  - packages/host-contracts/thread-error.mjs
  - node_modules/**/*
  - package.json
npmRebuild: false
directories:
  output: out
files:
  - desktop/**/*
  - dist/desktop/**/*
  - src/host/**/*
  - packages/host-kit/**/*.mjs
  - packages/host-contracts/thread-error.mjs
  - package.json
  # Keep the unpacked Host dependency graph executable while removing files
  # that are never loaded by the production carrier. Source maps and package
  # authoring/test material were the largest safe non-runtime payload class.
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.tsx"
  # Nested directories such as yaml/dist/doc contain runtime code.
  - "!node_modules/{*,@*/*}/{test,tests,__tests__,example,examples,benchmark,benchmarks,docs,doc}/**"
  - "!node_modules/**/{README.md,CHANGELOG.md,CHANGES.md}"
extraResources:
  - from: resources/opl-branding
    to: branding
    filter:
      - trayTemplate.png
      - trayTemplate@2x.png
  - from: resources/opl-framework-bootstrap
    to: opl-framework-bootstrap
    filter:
      - opl-install.sh
      - manifest.json
  - from: resources/preview-handoff.json
    to: preview-handoff.json
mac:
  icon: assets/branding/opl-studio.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  # Resource data stays covered by the App seal; only native code needs an
  # individual signature. osx-sign otherwise treats binary fonts/CMaps as code.
  signIgnore:
    - '/Contents/Frameworks/Electron Framework[.]framework(?:/Versions/[^/]+)?/Resources/(?:[^/]+[.]lproj/locale[.]pak|(?:chrome_[0-9]+_percent|resources)[.]pak|icudtl[.]dat|v8_context_snapshot[.][^/]+[.]bin)$'
    - '/Contents/Resources/app[.]asar[.]unpacked/node_modules/(?:katex/dist/fonts/[^/]+[.](?:ttf|woff2?)|pdfjs-dist/cmaps/[^/]+[.]bcmap)$'
    - '/Contents/Resources/app[.]asar[.]unpacked/node_modules/@deepseek-ai/dsh-cua-macos/native/bin(?:/|$)'
  target:
    - dmg
    - zip
dmg:
  format: ULFO
win:
  icon: assets/branding/opl-studio.png
  target:
    - nsis
    - zip
nsis:
  guid: a1f6388a-3f9a-5543-b06c-e3debfa55a91
linux:
  icon: assets/branding/opl-studio.png
  category: Development
  maintainer: Feng Gao <gaofeng21cn@hotmail.com>
  executableName: one-person-lab-preview
  target:
    - deb
deb:
  afterRemove: scripts/desktop/linux-after-remove.sh
artifactName: one-person-lab-preview-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: gaofeng21cn
  repo: opl-studio
afterPack: scripts/desktop/write-app-update-config.mjs
