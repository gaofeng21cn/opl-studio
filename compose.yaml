services:
  one-person-lab:
    build:
      context: .
      args:
        OPL_APP_REPOSITORY: ${OPL_APP_REPOSITORY:-https://github.com/gaofeng21cn/one-person-lab-app.git}
        OPL_APP_REF: ${OPL_APP_REF:-56ab1300fe632dfa8b8522dc20fbd8acb24ac636}
        OPL_BUN_VERSION: ${OPL_BUN_VERSION:-1.3.14}
        OPL_FRAMEWORK_REPOSITORY: ${OPL_FRAMEWORK_REPOSITORY:-https://github.com/gaofeng21cn/one-person-lab.git}
        OPL_FRAMEWORK_REF: ${OPL_FRAMEWORK_REF:-a277b2baf611e3352bdc5c81d95cd1aa20a118af}
        OPL_CODEX_NPM_SPEC: ${OPL_CODEX_NPM_SPEC:-@openai/codex@0.147.0}
        OPL_SOURCE_REVISION: ${OPL_SOURCE_REVISION:-local-candidate}
    image: ${OPL_APP_IMAGE:-one-person-lab-app:headless-candidate}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      OPL_HEADLESS_HOST: 0.0.0.0
      OPL_HEADLESS_PORT: 3000
      OPL_WEBUI_DEPLOYMENT_MODE: ${OPL_WEBUI_DEPLOYMENT_MODE:-local}
      OPL_WEBUI_AUTH_MODE: ${OPL_WEBUI_AUTH_MODE:-none}
      OPL_WEBUI_USERNAME: ${OPL_WEBUI_USERNAME:-opl}
      OPL_WEBUI_PASSWORD: ${OPL_WEBUI_PASSWORD:-}
      OPL_WEBUI_PASSWORD_FILE: ${OPL_WEBUI_PASSWORD_FILE:-}
      OPL_WEBUI_SESSION_SECRET: ${OPL_WEBUI_SESSION_SECRET:-}
      OPL_WEBUI_SESSION_SECRET_FILE: ${OPL_WEBUI_SESSION_SECRET_FILE:-}
      OPL_STUDIO_CODEX_CWD: /projects
      OPL_NATIVE_WORKBENCH_READ_ONLY: ${OPL_APP_READ_ONLY:-1}
    ports:
      - "127.0.0.1:${OPL_APP_PORT:-4178}:3000"
    volumes:
      - opl-data:/data
      - opl-projects:/projects
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  opl-data:
  opl-projects:
